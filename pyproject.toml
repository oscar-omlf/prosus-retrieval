[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prosus-food-search"
version = "0.1.0"
description = "Reproducible Portuguese marketplace semantic search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4",
  "bm25s==0.3.16",
  "tiktoken==0.14.0",
  "openai==3.42.1",
]

[project.optional-dependencies]
local = ["onnxruntime==1.31.1", "tokenizers==0.23.3", "huggingface-hub==2.4.0"]
dev = ["pytest==9.2.0"]

[project.scripts]
food-search = "prosus_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
