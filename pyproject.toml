[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prosus-food-search"
version = "0.2.0"
description = "Reproducible Portuguese marketplace semantic search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.4",
  "bm25s==0.3.16",
  "tiktoken==0.14.0",
  "openai==3.42.1",
  "python-dotenv==1.2.4",
  "snowballstemmer==3.1.1",
  "onnxruntime==1.31.1",
  "tokenizers==0.23.3",
  "huggingface-hub==2.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prosus_search = ["web/*.html", "web/*.css", "web/*.js", "web/*.png"]

[project.scripts]
food-search = "prosus_search.cli:main"
